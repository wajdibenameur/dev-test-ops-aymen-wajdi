name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  test-and-analysis:
    name: Tests & Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test with Coverage
        run: |
          mvn clean verify
          mvn jacoco:report

      - name: Verify JaCoCo Report
        run: test -f target/site/jacoco/jacoco.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=wajdibenameur_dev-test-ops-aymen-wajdi
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.junit.reportPaths=target/surefire-reports
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.scm.provider=git
            -Dsonar.branch.name=${{ github.ref_name }}

  docker-build-scan:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: test-and-analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        run: |
          echo "IMAGE_NAME=wajdiuser/projectfed" >> $GITHUB_ENV
          echo "COMMIT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "DATE_TAG=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest \
                       -t $IMAGE_NAME:$COMMIT_SHA \
                       -t $IMAGE_NAME:$BRANCH_NAME-$DATE_TAG .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: $IMAGE_NAME:latest
          format: table
          exit-code: 1

      - name: Push Docker images
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$COMMIT_SHA
          docker push $IMAGE_NAME:$BRANCH_NAME-$DATE_TAG

  kubernetes-deploy:
    name: Deploy to Minikube Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build-scan

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.30.0'

      - name: Set up Kubeconfig for Minikube
        run: |
          mkdir -p $HOME/.kube
          minikube start
          minikube kubectl -- get pods

      - name: Apply MySQL deployment
        run: |
          kubectl apply -f k8s/mysql.yaml

      - name: Apply Spring Boot Deployment
        run: |
          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Check Pods Status
        run: kubectl get pods -o wide
